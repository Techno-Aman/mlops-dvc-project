stages:
  prepare:
    cmd: python prepare.py
    deps:
      - prepare.py
      - data/iris.csv
    outs:
      - data/train.csv
      - data/test.csv

  train:
    cmd: python train.py
    deps:
      - train.py
      - data/train.csv
    params:
    - train.n_estimators
    outs:
      - model.pkl

  evaluate:
    cmd : python evaluate.py
    deps :
      - evaluate.py
      - data/test.csv
      - model.pkl
    metrics :
      - metrics.txt